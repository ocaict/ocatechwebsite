<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#012D96" />
      <stop offset="50%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#FF6600" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#D60000" />
    </linearGradient>
  </defs>

  <!-- Tech Icon Symbol -->
  <g transform="translate(4, 8)">
    <rect x="2" y="2" width="40" height="40" rx="10" fill="#071125" stroke="url(#logoGrad)" stroke-width="2.5" />
    <!-- Circuit / Pulse motif -->
    <path d="M12 22 L18 22 L22 14 L26 30 L30 22 L34 22" stroke="#46CEFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="12" cy="22" r="2" fill="#FF6600" />
    <circle cx="34" cy="22" r="2" fill="#46CEFF" />
  </g>

  <!-- Wordmark -->
  <text x="56" y="38" font-family="'Inter', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#FFFFFF">
    OCA<tspan fill="url(#redAccent)">TECH</tspan>
  </text>
  <text x="58" y="50" font-family="'Inter', 'Poppins', 'Segoe UI', sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.5" fill="#9AA5B8">
    DIGITAL SOLUTIONS
  </text>
</svg>
