<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#071125" rx="12" />
  <rect x="2" y="2" width="596" height="396" fill="none" stroke="#1c3560" stroke-width="2" rx="10" />
  <circle cx="300" cy="180" r="100" fill="#3FB200" opacity="0.15" />
  <!-- Software & Maintenance Graphic -->
  <g transform="translate(200, 80)">
    <!-- Monitor -->
    <rect x="20" y="20" width="160" height="110" rx="8" fill="#0b1a38" stroke="#46CEFF" stroke-width="3" />
    <polygon points="90,130 110,130 115,160 85,160" fill="#1c3560" />
    <line x1="70" y1="160" x2="130" y2="160" stroke="#46CEFF" stroke-width="3" />
    <!-- Gear / Settings -->
    <circle cx="140" cy="50" r="18" fill="#071125" stroke="#3FB200" stroke-width="3" />
    <circle cx="140" cy="50" r="6" fill="#3FB200" />
    <!-- Code brackets -->
    <path d="M50 65 L40 75 L50 85" stroke="#FF6600" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M90 65 L100 75 L90 85" stroke="#FF6600" stroke-width="3" fill="none" stroke-linecap="round" />
    <line x1="75" y1="62" x2="65" y2="88" stroke="#46CEFF" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="300" y="290" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">Software &amp; OS Maintenance</text>
  <text x="300" y="325" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#9AA5B8">OS Setup, Antivirus, Creative Tools &amp; Hardware Upgrades</text>
</svg>
