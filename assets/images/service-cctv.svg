<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#071125" rx="12" />
  <rect x="2" y="2" width="596" height="396" fill="none" stroke="#1c3560" stroke-width="2" rx="10" />
  <circle cx="300" cy="180" r="100" fill="#012D96" opacity="0.2" />
  <!-- CCTV Camera Graphic -->
  <g transform="translate(210, 90)" stroke="#46CEFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera Body -->
    <path d="M40 70 L140 70 L150 95 L30 95 Z" fill="#0a1a38" stroke="#46CEFF" />
    <circle cx="90" cy="85" r="14" fill="#071125" stroke="#FF6600" stroke-width="4" />
    <circle cx="90" cy="85" r="5" fill="#FF0000" />
    <!-- Mount -->
    <path d="M120 70 L120 30 L160 30" />
    <rect x="156" y="20" width="14" height="24" fill="#46CEFF" />
    <!-- Wireless signal arcs -->
    <path d="M60 45 A 50 50 0 0 1 120 45" stroke="#3FB200" stroke-width="3" stroke-dasharray="4 4" />
    <path d="M45 35 A 70 70 0 0 1 135 35" stroke="#3FB200" stroke-width="3" stroke-dasharray="4 4" />
  </g>
  <text x="300" y="290" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">HD / IP CCTV Systems</text>
  <text x="300" y="325" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#9AA5B8">Remote Smartphone Monitoring &amp; Motion Security</text>
</svg>
